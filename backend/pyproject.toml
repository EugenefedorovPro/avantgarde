[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "avantgarde/management/",
    "avantgarde/migrations/",
    "avantgarde/tests/",
]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.ruff]
line-length = 88
exclude = ["avantgarde/migrations"]

[tool.ruff.lint]
select = ["E", "F"]
