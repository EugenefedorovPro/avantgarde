name: Build, Push, Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Test backend
        working-directory: backend
        env:
          SECRET_KEY: test-only-secret-key-for-ci-not-production-1234567890
        run: |
          pip install -r requirements-dev.txt
          black --check .
          isort --check-only .
          mypy avantgarde
          ruff check .
          mkdir -p data
          python manage.py makemigrations --check --dry-run
          python manage.py test
          pip check

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  build-and-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # --- backend ---
      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            eugene8pro/django_avant:2.0
            eugene8pro/django_avant:latest

      # --- nginx ---
      - name: Build and push nginx image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./nginx/Dockerfile
          push: true
          tags: |
            eugene8pro/nginx_avant:2.0
            eugene8pro/nginx_avant:latest
          build-args: |
            VITE_BASE_URL=${{ secrets.VITE_BASE_URL }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            set -euxo pipefail

            cd /opt/apps/avant_garde_at_war

            # Pull first, then replace containers to minimize downtime.
            docker compose pull
            docker compose up -d --remove-orphans

            docker compose ps

            # cleanup dangling layers etc.
            docker image prune -f
